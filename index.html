<script>
/* Geodesic Morph - one self-contained file: raw WebGL 1 + GLSL, no libraries, no external assets.
   URL options: ?fps=30|60  ?t=<seconds>  ?debug  ?q=low|med|high
   Test-only:   &pause (freeze the scene clock at ?t)   &lat=42 (coarser lattice)   &view=a|blur|bloom|grain|aux
   Loop rule:   every time-based motion is sin/cos(k * 2*PI/600 * t) with integer k -> exact 600 s loop. */
(function(){
'use strict';
var TAU=6.283185307179586,LOOP=600,W0=TAU/LOOP;

/* ------------------------------------------------------------------ options */
var QS=new URLSearchParams(location.search);
function qn(k,d){var v=parseFloat(QS.get(k));return isFinite(v)?v:d;}
var OPT={
  fps:qn('fps',60)<=30?30:60,
  t:qn('t',0),
  debug:QS.has('debug'),
  q:(QS.get('q')||'').toLowerCase(),
  pause:QS.has('pause')||QS.has('freeze'),
  nowrap:QS.has('nowrap'),
  lat:qn('lat',42)>100?162:42,
  shade:QS.get('shade')==='0'?0:1,
  view:(QS.get('view')||'').toLowerCase()
};

/* ------------------------------------------------------------------ scene constants (world unit = mean body radius) */
var CAM_D=2.6;        // camera distance  -> ~35 deg FOV across the short screen side
var BOUND=1.17;       // nothing (cage, pearls, blur, touch pull) may leave this radius
var FIT=0.47;         // BOUND maps to 42% of the short side -> 8% margin each side
var CENTER_UP=0.0;  // object centre sits 4.5% of the height above the middle
var TILT0=0.0;      // low camera: top of the object tilted away
var CX=0,CY=0,CZ=-CAM_D;
var SHOW_CAGE=QS.has('cage');
var BGI=qn('bg',1.4);   // background intensity dial: ?bg=1.4 etc.
var DOF_GAIN=qn('dof',12);
var CAGE_R=1.10,CG_PEARL=0.042,CG_ROD=0.017,CG_STRUT=0.011;

/* ------------------------------------------------------------------ helpers */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
var rnd=mulberry32(20261114);
function rr(a,b){return a+(b-a)*rnd();}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function sstep(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x);}
function clamp(x,a,b){return x<a?a:x>b?b:x;}
function m3mul(a,b,o){
  var a0=a[0],a1=a[1],a2=a[2],a3=a[3],a4=a[4],a5=a[5],a6=a[6],a7=a[7],a8=a[8];
  var b0=b[0],b1=b[1],b2=b[2],b3=b[3],b4=b[4],b5=b[5],b6=b[6],b7=b[7],b8=b[8];
  o[0]=a0*b0+a1*b3+a2*b6;o[1]=a0*b1+a1*b4+a2*b7;o[2]=a0*b2+a1*b5+a2*b8;
  o[3]=a3*b0+a4*b3+a5*b6;o[4]=a3*b1+a4*b4+a5*b7;o[5]=a3*b2+a4*b5+a5*b8;
  o[6]=a6*b0+a7*b3+a8*b6;o[7]=a6*b1+a7*b4+a8*b7;o[8]=a6*b2+a7*b5+a8*b8;
}
function m3rx(t,o){var c=Math.cos(t),s=Math.sin(t);o[0]=1;o[1]=0;o[2]=0;o[3]=0;o[4]=c;o[5]=-s;o[6]=0;o[7]=s;o[8]=c;}
function m3ry(t,o){var c=Math.cos(t),s=Math.sin(t);o[0]=c;o[1]=0;o[2]=s;o[3]=0;o[4]=1;o[5]=0;o[6]=-s;o[7]=0;o[8]=c;}
function m3rz(t,o){var c=Math.cos(t),s=Math.sin(t);o[0]=c;o[1]=-s;o[2]=0;o[3]=s;o[4]=c;o[5]=0;o[6]=0;o[7]=0;o[8]=1;}
/* periodic "noise": a few travelling plane waves, every temporal frequency an integer multiple of 2PI/600 */
function makeWaves(ks,amps,smin,smax){
  var n=ks.length,w={n:n,k:new Float64Array(n),a:new Float64Array(n),qx:new Float64Array(n),qy:new Float64Array(n),qz:new Float64Array(n),c:new Float64Array(n),norm:0};
  for(var j=0;j<n;j++){
    var z=rr(-1,1),ph=rr(0,TAU),s=Math.sqrt(1-z*z),f=rr(smin,smax);
    w.k[j]=ks[j]*(rnd()<0.5?-1:1);w.a[j]=amps[j];
    w.qx[j]=s*Math.cos(ph)*f;w.qy[j]=z*f;w.qz[j]=s*Math.sin(ph)*f;w.c[j]=rr(0,TAU);w.norm+=Math.abs(amps[j]);
  }
  return w;
}
function wav(w,x,y,z,t){var s=0;for(var j=0;j<w.n;j++)s+=w.a[j]*Math.sin(w.k[j]*W0*t+w.qx[j]*x+w.qy[j]*y+w.qz[j]*z+w.c[j]);return s;}

/* ------------------------------------------------------------------ palette (sampled from the reference video; hue 262..322 deg) */
/* COLOUR: the source video turns the body through the whole hue wheel in one direction (violet -> orchid ->
   rose -> peach -> olive -> green -> teal -> blue -> violet). The violet-phase ramp sampled from the clip is the
   base; every other phase is that ramp with its hue rotated in OKLCH (lightness and chroma kept, chroma eased
   only where sRGB cannot hold it), so it stays a soft frosted pastel all the way round.
   The background is the sage of the violet phase rotated by the same angle = roughly the body's complement. */
var BASE_RAMP=[[0,'#603f86'],[0.15,'#7e66af'],[0.30,'#916bb1'],[0.45,'#a582ce'],[0.60,'#b79fe1'],[0.78,'#ceb9ef'],[0.92,'#e0d8f7'],[1,'#e8dcf8']];
var BG_BASE='#a3b2a3';
function hex3(h){return [parseInt(h.substr(1,2),16)/255,parseInt(h.substr(3,2),16)/255,parseInt(h.substr(5,2),16)/255];}
function s2l(c){return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function l2s(c){return c<=0.0031308?12.92*c:1.055*Math.pow(c,1/2.4)-0.055;}
function toLab(c,o){var r=s2l(c[0]),g=s2l(c[1]),b=s2l(c[2]);
  var l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b),m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b),q=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
  o[0]=0.2104542553*l+0.7936177850*m-0.0040720468*q;o[1]=1.9779984951*l-2.4285922050*m+0.4505937099*q;o[2]=0.0259040371*l+0.7827717662*m-0.8086757660*q;}
function fromLab(L,a,b,o){var l=L+0.3963377774*a+0.2158037573*b,m=L-0.1055613458*a-0.0638541728*b,q=L-0.0894841775*a-1.2914855480*b;l=l*l*l;m=m*m*m;q=q*q*q;
  var r=4.0767416621*l-3.3077115913*m+0.2309699292*q,g=-1.2684380046*l+2.6097574011*m-0.3413193965*q,bb=-0.0041960863*l-0.7034186147*m+1.7076147010*q;
  o[0]=l2s(clamp(r,0,1));o[1]=l2s(clamp(g,0,1));o[2]=l2s(clamp(bb,0,1));
  return r>=-0.0005&&r<=1.0005&&g>=-0.0005&&g<=1.0005&&bb>=-0.0005&&bb<=1.0005;}
var _lab=[0,0,0],_pa=[0,0,0];
function rotHue(c,ang,o){toLab(c,_lab);var ca=Math.cos(ang),sa=Math.sin(ang),pk=0.80+0.20*ca,a=(_lab[1]*ca-_lab[2]*sa)*pk,b=(_lab[1]*sa+_lab[2]*ca)*pk;   // pk: a little less chroma away from violet keeps yellow / cyan frosted, never neon
  for(var k=1;k>0.3;k-=0.04)if(fromLab(_lab[0],a*k,b*k,o))return;}
(function(){for(var j=0;j<BASE_RAMP.length;j++)BASE_RAMP[j][1]=hex3(BASE_RAMP[j][1]);BG_BASE=hex3(BG_BASE);})();
function rampAt(tone,o){
  var st=BASE_RAMP,n=st.length;tone=clamp(tone,0,1);
  for(var i=1;i<n;i++){if(tone<=st[i][0]||i===n-1){var a=st[i-1],b=st[i],u=clamp((tone-a[0])/(b[0]-a[0]),0,1);
    o[0]=a[1][0]+(b[1][0]-a[1][0])*u;o[1]=a[1][1]+(b[1][1]-a[1][1])*u;o[2]=a[1][2]+(b[1][2]-a[1][2])*u;return;}}
}
function palAt(ph,tone,o){rampAt(tone,_pa);rotHue(_pa,(ph-Math.floor(ph))*TAU,o);}   // ph: 0..1 = one turn of the wheel
function bgAt(ph,o){rotHue(BG_BASE,(ph-Math.floor(ph))*TAU,o);}

/* ------------------------------------------------------------------ static geometry */
/* BODY HULL: icosahedron subdivided once = 42 vertices, 80 flat glass facets.
   LATTICE:   the same mesh subdivided again = 162 nodes / 480 rods riding on the hull (5- and 6-valent nodes).
   CORE:      two interpenetrating distorted cuboids (24 facets) carrying most of the grain islands.
   CAGE:      icosahedron of 12 big pearls / 30 thick rods outside, tied to the lattice by 12 struts. */
var HV=42,HF=80,HE=120;
var hDir=new Float64Array(HV*3),hBase=new Float64Array(HV),hE1=new Float64Array(HV*3),hE2=new Float64Array(HV*3);
var hTK1=new Float64Array(HV),hTK2=new Float64Array(HV),hTP1=new Float64Array(HV),hTP2=new Float64Array(HV),hTA=new Float64Array(HV);
var hF=new Uint8Array(HF*3),hAdj=new Uint8Array(HF*3),hFDir=new Float64Array(HF*3),hFR=new Float64Array(HF*8);
var hEd=new Uint8Array(HE*2);
var fDirS=new Float64Array(HV*3),lR=new Float64Array(HV),tMax=0,hPar=new Uint8Array(HV*2),hSO=new Float64Array(HV*2),hStat=new Float64Array(HV),hObj=new Float64Array(HV*3),hRad=new Float64Array(HV),hObjG=new Float64Array(HV*3),hRadG=new Float64Array(HV),cgNb=[],wFlat;
var icoEd=[];
var NN=0,NR=0,rodA,rodB,rodRad,rodK,rodPh,nodeRad,nodeSK,nodeSP,nodeLP,nodeEdge;
var CN=12,CR=42,cgA=new Int16Array(CR),cgB=new Int16Array(CR),cgK=new Float64Array(CN*3),cgP=new Float64Array(CN*3),cgRK=new Float64Array(CR),cgRP=new Float64Array(CR);
var KV=16,KQ=12,kHalf=[[0.88,0.76,0.82],[0.68,0.92,0.64]],kNK=new Float64Array(KV*6),kNP=new Float64Array(KV*6),kQ=new Uint8Array(KQ*4),kQAdj=new Uint8Array(KQ*8),kQR=new Float64Array(KQ*8);
var wRad,wDeep,wFrost,wPatch,wTone,wCoreP;

function buildScene(){
  var i,j,k,a,b,c;
  // --- icosahedron, one vertex on the pole
  var v=[],h=1/Math.sqrt(5),r=2/Math.sqrt(5);
  v.push([0,1,0]);
  for(i=0;i<5;i++){a=TAU*i/5;v.push([r*Math.cos(a),h,r*Math.sin(a)]);}
  for(i=0;i<5;i++){a=TAU*(i+0.5)/5;v.push([r*Math.cos(a),-h,r*Math.sin(a)]);}
  v.push([0,-1,0]);
  var f=[];
  for(i=0;i<5;i++){j=(i+1)%5;f.push([0,1+i,1+j],[1+i,6+i,1+j],[1+j,6+i,6+j],[11,6+j,6+i]);}
  function orient(F,V){for(var q=0;q<F.length;q++){var A=V[F[q][0]],B=V[F[q][1]],C=V[F[q][2]];
    var ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
    var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
    if(nx*(A[0]+B[0]+C[0])+ny*(A[1]+B[1]+C[1])+nz*(A[2]+B[2]+C[2])<0){var t=F[q][1];F[q][1]=F[q][2];F[q][2]=t;}}}
  orient(f,v);
  var seen={};
  for(i=0;i<f.length;i++)for(j=0;j<3;j++){a=f[i][j];b=f[i][(j+1)%3];k=a<b?a*64+b:b*64+a;if(!seen[k]){seen[k]=1;icoEd.push(a<b?[a,b]:[b,a]);}}
  // --- 2V subdivision -> hull
  var cache={},faces=[];
  function mid(p,q){var key=p<q?p*64+q:q*64+p;if(cache[key]!==undefined)return cache[key];
    var A=v[p],B=v[q],x=A[0]+B[0],y=A[1]+B[1],z=A[2]+B[2],l=Math.sqrt(x*x+y*y+z*z);v.push([x/l,y/l,z/l]);cache[key]=v.length-1;return cache[key];}
  for(i=0;i<f.length;i++){a=f[i][0];b=f[i][1];c=f[i][2];var ab=mid(a,b),bc=mid(b,c),ca=mid(c,a);
    faces.push([a,ab,ca],[b,bc,ab],[c,ca,bc],[ab,bc,ca]);}
  for(i=0;i<12;i++)cgNb.push([]);
  for(i=0;i<icoEd.length;i++){var mm=mid(icoEd[i][0],icoEd[i][1]);cgNb[icoEd[i][0]].push(mm);cgNb[icoEd[i][1]].push(mm);hPar[mm*2]=icoEd[i][0];hPar[mm*2+1]=icoEd[i][1];}
  for(i=0;i<HV;i++){
    var d=v[i];hDir[i*3]=d[0];hDir[i*3+1]=d[1];hDir[i*3+2]=d[2];
    hBase[i]=i<12?1.0:0.87;                                   // puffed icosahedron: big, nearly planar gem faces
    var ax=Math.abs(d[1])>0.9?1:0,ay=Math.abs(d[1])>0.9?0:1,az=0;
    var ex=d[1]*az-d[2]*ay,ey=d[2]*ax-d[0]*az,ez=d[0]*ay-d[1]*ax,l=Math.sqrt(ex*ex+ey*ey+ez*ez);ex/=l;ey/=l;ez/=l;
    hE1[i*3]=ex;hE1[i*3+1]=ey;hE1[i*3+2]=ez;
    hE2[i*3]=d[1]*ez-d[2]*ey;hE2[i*3+1]=d[2]*ex-d[0]*ez;hE2[i*3+2]=d[0]*ey-d[1]*ex;
    hTK1[i]=ri(6,30);hTK2[i]=ri(6,30);hTP1[i]=rr(0,TAU);hTP2[i]=rr(0,TAU);hTA[i]=i<12?0.09:0.12;hSO[i*2]=rr(-1,1)*(i<12?0.10:0.15);hSO[i*2+1]=rr(-1,1)*(i<12?0.10:0.15);hStat[i]=rr(-0.35,0.35);
  }
  for(i=0;i<HV;i++){      // the steady frame: fixed, slightly irregular node directions and radii
    var q3=i*3,sx_=hDir[q3]+hE1[q3]*hSO[i*2]+hE2[q3]*hSO[i*2+1],sy_=hDir[q3+1]+hE1[q3+1]*hSO[i*2]+hE2[q3+1]*hSO[i*2+1],sz_=hDir[q3+2]+hE1[q3+2]*hSO[i*2]+hE2[q3+2]*hSO[i*2+1],sl_=Math.sqrt(sx_*sx_+sy_*sy_+sz_*sz_);
    fDirS[q3]=sx_/sl_;fDirS[q3+1]=sy_/sl_;fDirS[q3+2]=sz_/sl_;lR[i]=(i<12?1.04:0.95)+rr(-0.022,0.022);
  }
  var ekey={},ne=0,eFaces=[];
  function edgeId(p,q){var key=p<q?p*64+q:q*64+p;if(ekey[key]===undefined){ekey[key]=ne;hEd[ne*2]=Math.min(p,q);hEd[ne*2+1]=Math.max(p,q);eFaces.push([]);ne++;}return ekey[key];}

    var F=faces[i];hF[i*3]=F[0];hF[i*3+1]=F[1];hF[i*3+2]=F[2];
    for(j=0;j<3;j++){var e=edgeId(F[(j+1)%3],F[(j+2)%3]);eFaces[e].push([i,j]);}   // local edge j is opposite vertex j
    var x=v[F[0]][0]+v[F[1]][0]+v[F[2]][0],y=v[F[0]][1]+v[F[1]][1]+v[F[2]][1],z=v[F[0]][2]+v[F[1]][2]+v[F[2]][2],l2=Math.sqrt(x*x+y*y+z*z);
    hFDir[i*3]=x/l2;hFDir[i*3+1]=y/l2;hFDir[i*3+2]=z/l2;
    hFR[i*8]=rr(-1,1);hFR[i*8+1]=rr(-1,1);hFR[i*8+2]=rr(0,8);hFR[i*8+3]=rr(0,8);hFR[i*8+4]=rr(-1,1);hFR[i*8+5]=ri(4,14);hFR[i*8+6]=rr(0,TAU);hFR[i*8+7]=rr(0,1);
  }
  for(e=0;e<HE;e++){var A=eFaces[e][0],B=eFaces[e][1];hAdj[A[0]*3+A[1]]=B[0];hAdj[B[0]*3+B[1]]=A[0];}
  // --- FOLD SEQUENCE: one section at a time. Each 2.5 s step exactly one of the 12 corners folds in (dent) or back out,
  //     its five surrounding panels hinging with it; the next fold starts only when this one has locked. Mostly
  //     camera-facing corners, so the viewer sees each fold. 120 folds, then the same 120 again (each corner toggles an
  //     even number of times -> the shape is back where it started at 600 s: exact loop).
  (function(){
    var st=[],last=-1,prev=-1,half=[],n,i;
    for(i=0;i<12;i++){foldIn[i]=rr(0.78,0.86);foldOut[i]=rr(1.02,1.10);st[i]=rnd()<0.5?1:0;}
    for(n=0;n<120;n++){
      var c;do{c=ri(0,11);}while(c===last||c===prev||(hDir[c*3+2]<-0.15&&rnd()<0.8));
      half.push(c);prev=last;last=c;
    }
    var sch=half.concat(half);
    for(n=0;n<=NSTEP;n++){for(i=0;i<12;i++)foldS[n*12+i]=st[i]?foldOut[i]:foldIn[i];if(n<NSTEP)st[sch[n]]^=1;}
  })();
  // --- lattice
  var rods=[];
  if(OPT.lat===162){
    NN=HV+HE;
    for(e=0;e<HE;e++){rods.push([hEd[e*2],HV+e,0],[HV+e,hEd[e*2+1],0]);}
    for(i=0;i<HF;i++){var e0=edgeId(hF[i*3],hF[i*3+1]),e1=edgeId(hF[i*3+1],hF[i*3+2]),e2=edgeId(hF[i*3+2],hF[i*3]);
      rods.push([HV+e0,HV+e1,1],[HV+e1,HV+e2,1],[HV+e2,HV+e0,1]);}
  }else{
    NN=HV;for(e=0;e<HE;e++)rods.push([hEd[e*2],hEd[e*2+1],0]);
  }
  NR=rods.length;
  rodA=new Uint16Array(NR);rodB=new Uint16Array(NR);rodRad=new Float64Array(NR);rodK=new Float64Array(NR);rodPh=new Float64Array(NR);
  var fine=OPT.lat===162;
  for(i=0;i<NR;i++){rodA[i]=rods[i][0];rodB[i]=rods[i][1];rodRad[i]=fine?(rods[i][2]?0.0036:0.0042):0.0046;rodK[i]=ri(4,8);rodPh[i]=rr(0,1);}
  nodeRad=new Float64Array(NN);nodeSK=new Float64Array(NN);nodeSP=new Float64Array(NN);nodeLP=new Float64Array(NN);
  for(i=0;i<NN;i++){nodeRad[i]=fine?(i<12?0.0245:i<HV?0.0225:0.0195):(i<12?0.027:0.024);nodeSK[i]=ri(12,36);nodeSP[i]=rr(0,TAU);nodeLP[i]=rr(0,TAU);}
  // --- outer cage (icosahedron + struts)
  for(i=0;i<30;i++){cgA[i]=icoEd[i][0];cgB[i]=icoEd[i][1];}
  for(i=0;i<12;i++){cgA[30+i]=i;cgB[30+i]=-1-i;}            // strut: cage node i -> lattice node i
  for(i=0;i<CN;i++){cgK[i*3]=ri(55,115);cgK[i*3+1]=ri(55,115);cgK[i*3+2]=ri(60,110);cgP[i*3]=rr(0,TAU);cgP[i*3+1]=rr(0,TAU);cgP[i*3+2]=rr(0,TAU);}
  for(i=0;i<CR;i++){cgRK[i]=ri(3,6);cgRP[i]=rr(0,1);}

var VS_GLOW='attribute vec2 aP;uniform vec4 uC;varying vec2 vUv;void main(){vUv=aP;gl_Position=vec4(uC.xy+aP*uC.zw,0.0,1.0);}';

/* FINAL: bloom (screen blend), very soft vignette, static dither against banding */
var FS_FINAL=`
varying vec2 vUv;uniform sampler2D uScene,uBloom;uniform vec4 uFx;

/* procedural textures, rendered once on the GPU at start-up (no image assets) */
var FS_GRAIN=`
varying vec2 vUv;
vec2 h2(vec2 p,float per){p=mod(p,per);vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy)*2.0-1.0;}

/* frost = fine sugar grains: one jittered round bead per cell (tileable), random size, plus a faint fine noise */
float beads(vec2 uv,float per,float seed){
  vec2 p=uv*per,i=floor(p),f=fract(p);float h=0.0;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 o=vec2(float(x),float(y)),c=i+o;
    vec2 j=h2(c+seed,per)*0.5+0.5,k=h2(c+seed+17.0,per)*0.5+0.5;

float height(vec2 uv){
  float b1=beads(uv,96.0,0.0),b2=beads(uv,160.0,31.0);

void main(){
  float e=1.0/512.0;
  float h=height(vUv);
  float dx=height(vUv+vec2(e,0.0))-height(vUv-vec2(e,0.0));
  float dy=height(vUv+vec2(0.0,e))-height(vUv-vec2(0.0,e));

var FS_AUX=`
varying vec2 vUv;
float h1(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}

/* ------------------------------------------------------------------ sizing + quality tiers */
var TIERS=[{s:1.0,ghost:3,bloom:1,name:'high'},{s:0.8334,ghost:2,bloom:1,name:'med'},{s:0.6667,ghost:1,bloom:0,name:'low'}];
var tier=0,tierLocked=false;
if(OPT.q==='high'){tier=0;tierLocked=true;}else if(OPT.q==='med'){tier=1;tierLocked=true;}else if(OPT.q==='low'){tier=2;tierLocked=true;}
var proj=new Float32Array(16);
function resize(force){
  var cssW=Math.max(1,canvas.clientWidth||window.innerWidth),cssH=Math.max(1,canvas.clientHeight||window.innerHeight);
  var base=Math.min(window.devicePixelRatio||1,1.5);                   // render scale 1.5x CSS px, never the native 3.5x
  var cw=Math.max(2,Math.round(cssW*base)),ch=Math.max(2,Math.round(cssH*base));
  var W=Math.max(2,Math.round(cw*TIERS[tier].s)),H=Math.max(2,Math.round(ch*TIERS[tier].s));
  if(!force&&cw===S.cw&&ch===S.ch&&W===S.W&&H===S.H&&TA)return;
  if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
  S.cw=cw;S.ch=ch;S.cssW=cssW;S.cssH=cssH;S.W=W;S.H=H;S.px=W/cssW;
  var bound=Math.min(FIT*W,(FIT-CENTER_UP)*H);
  S.f=bound*Math.sqrt(CAM_D*CAM_D-BOUND*BOUND)/BOUND;S.ppu=S.f/CAM_D;S.oy=2*CENTER_UP;
  var n=CAM_D-2.2,f=CAM_D+2.2;
  for(var i=0;i<16;i++)proj[i]=0;
  proj[0]=2*S.f/W;proj[5]=2*S.f/H;proj[9]=-S.oy;proj[10]=(n+f)/(n-f);proj[11]=-1;proj[14]=2*n*f/(n-f);
  freeTarget(TA);freeTarget(TB);freeTarget(Q0);freeTarget(Q1);freeTarget(Q2);if(depthRB)gl.deleteRenderbuffer(depthRB);
  depthRB=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,depthRB);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,W,H);
  TA=mkTarget(W,H,depthRB);TB=mkTarget(W,H,depthRB);
  var qw=Math.max(2,Math.ceil(W/4)),qh=Math.max(2,Math.ceil(H/4));
  Q0=mkTarget(qw,qh,null);Q1=mkTarget(qw,qh,null);Q2=mkTarget(qw,qh,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function setTier(n){tier=n;resize(true);}

/* ------------------------------------------------------------------ draw */
var bgc=[0,0,0],c1=[0,0,0],c2=[0,0,0],c3=[0,0,0],c4=[0,0,0];
function bindFacet(p){
  gl.bindBuffer(gl.ARRAY_BUFFER,vboFacet);setAttr(p.n);var st=FSTR*4;
  gl.vertexAttribPointer(0,3,gl.FLOAT,false,st,0);

function facetUniforms(p,phase){

  gl.uniform3f(p.uL,LX,LY,LZ);gl.uniform2f(p.uRes,S.W,S.H);
  gl.uniform4f(p.uBeat,HB,HBR,HBA,0);gl.uniform2f(p.uCen,S.W*0.5,S.H*(0.5+S.oy*0.5));

  gl.uniform4f(p.uCau,0.11*Math.cos(ca),0.11*Math.sin(ca),0.09*Math.cos(cb+1.3),0.09*Math.sin(cb+1.3));

  gl.uniform4f(p.uCam,S.f,CAM_D-0.95,DOF_GAIN*S.px,0.006);
  gl.uniform3f(p.uL,LX,LY,LZ);gl.uniform1f(p.uBt,HB);gl.uniform1f(p.uTime,animT);
  palAt(phase,0.96,c1);palAt(phase,0.42,c2);palAt(phase+0.06,1.0,c3);
  gl.uniform3f(p.uCol,0.80*0.88+c1[0]*0.12,0.83*0.88+c1[1]*0.12,0.87*0.88+c1[2]*0.12);   // matte pale steel, faintly tinted by the body (no glow)
  gl.uniform3f(p.uShade,0.44*0.70+c2[0]*0.30,0.47*0.70+c2[1]*0.30,0.53*0.70+c2[2]*0.30);

function drawCage(phase){
  if(!SHOW_CAGE)return;   // outer cage retired (Nick, 11-16): the lattice on the body is the frame now
  var g=TIERS[tier].ghost,r0=NR,j0=NN;
  useRods(phase);drawRods(r0+CR*(NGHOST-g),CR*g);
  useJoints(phase);drawRods(j0+CN*(NGHOST-g),CN*g);
  r0+=CR*NGHOST;j0+=CN*NGHOST;
  useRods(phase);drawRods(r0,draws.cgRodFar);
  useJoints(phase);drawRods(j0,draws.cgJFar);
  useRods(phase);drawRods(r0+draws.cgRodFar,draws.cgRodNear);

}

/* ------------------------------------------------------------------ main loop: 60 fps cap, pause when hidden, adaptive quality */

  if(avg>Math.max(18,budget*1.08)){perf.slow+=0.5;perf.fast=0;}else if(avg<budget*1.05){perf.fast+=0.5;perf.slow=Math.max(0,perf.slow-0.25);}else perf.fast=0;
  if(perf.slow>=2&&tier<TIERS.length-1){setTier(tier+1);perf.slow=0;perf.fast=0;perf.backoff=Math.min(perf.backoff*2,120);perf.warm=1;}
  else if(perf.fast>=perf.backoff&&tier>0){setTier(tier-1);perf.slow=0;perf.fast=0;perf.warm=1;}

function renderNow(dt){

  lastT=now;

  if(OPT.debug){dbgAcc+=el;dbgN++;if(now-dbgLast>500){dbgEl.textContent=(1000/(dbgAcc/dbgN)).toFixed(1)+' fps  '+(dbgAcc/dbgN).toFixed(1)+' ms\n'+TIERS[tier].name+(tierLocked?' (locked)':' (auto)')+'  '+S.W+'x'+S.H+'\nt='+sceneT.toFixed(2)+' s';dbgAcc=0;dbgN=0;dbgLast=now;}}
}
function start(){if(running||!gl)return;running=true;lastT=performance.now()-1000/OPT.fps;raf=requestAnimationFrame(tick);}

function boot(){
  buildScene();allocDynamic();
  sceneT=OPT.nowrap?OPT.t:((OPT.t%LOOP)+LOOP)%LOOP;
  if(!initGL()){document.body.style.background='#9fb1a4';return;}
  resize(true);
  if(OPT.debug)dbgEl.style.display='block';
  var np={passive:false};

  canvas.addEventListener('pointerup',onUp,np);canvas.addEventListener('pointercancel',onUp,np);

  canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();stop();},false);

    var o=[],i;for(i=0;i<12;i++)o.push(Math.hypot(hv[i*3]-CX,hv[i*3+1]-CY,hv[i*3+2]-CZ),Math.hypot(ln[i*3]-CX,ln[i*3+1]-CY,ln[i*3+2]-CZ),Math.hypot(cg[0][i*3]-CX,cg[0][i*3+1]-CY,cg[0][i*3+2]-CZ));return o;},
  wake:function(){return {n:nWake,s:Array.prototype.slice.call(wkS)};},
  touches:function(){return tch.map(function(t){return {on:t.on,s:t.s};});},
  orbit:function(){return {yaw:orb.yaw,pitch:orb.pitch,vy:orb.vy};},
  renderAt:function(t){sceneT=t;var p=OPT.pause;OPT.pause=true;renderNow(0);OPT.pause=p;return frames;},
  /* projected bounding box (CSS px) of all geometry incl. pearl radii at scene time t */
  bbox:function(t){
    computeFrame(t);
    var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9,k=S.cssW/S.W,i;
    function acc(x,y,z,r,body){var iz=S.f/(-z),sx=(S.W*0.5+x*iz)*k,sy=(S.H-(S.H*(0.5+S.oy*0.5)+y*iz))*k,rr2=r*iz*k;
      if(body){if(sx<bx0)bx0=sx;if(sx>bx1)bx1=sx;if(sy<by0)by0=sy;if(sy>by1)by1=sy;}
      if(sx-rr2<x0)x0=sx-rr2;if(sx+rr2>x1)x1=sx+rr2;if(sy-rr2<y0)y0=sy-rr2;if(sy+rr2>y1)y1=sy+rr2;}
    for(i=0;i<HV;i++)acc(hv[i*3],hv[i*3+1],hv[i*3+2],0,true);
    for(i=0;i<KV;i++)acc(kv[i*3],kv[i*3+1],kv[i*3+2],0,false);
    for(i=0;i<NN;i++)acc(ln[i*3],ln[i*3+1],ln[i*3+2],nodeRad[i],false);
    for(var g=0;g<=NGHOST;g++)for(i=0;i<CN;i++)acc(cg[g][i*3],cg[g][i*3+1],cg[g][i*3+2],CG_PEARL,false);
    return {x0:x0,x1:x1,y0:y0,y1:y1,bx0:bx0,bx1:bx1,by0:by0,by1:by1,w:S.cssW,h:S.cssH};
  }
};
boot();
})();
